<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - 高效待辦清單</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        appBg: '#0B132B',
                        cardBg: '#131C35',
                        cardBorder: '#202E54',
                        accentBlue: '#3B82F6'
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome & Google Fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        /* Custom Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0B132B;
        }
        ::-webkit-scrollbar-thumb {
            background: #202E54;
            border-radius: 99px;
        }

        /* Circular Progress Dash Offset Smooth Transition */
        #progress-ring {
            transition: stroke-dashoffset 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Hide Default Date Picker Icon Styling for clean appearance */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-[#0B132B] text-slate-100 min-h-screen font-sans pb-16 transition-colors duration-200">

    <!-- Main Application Wrapper -->
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-8 space-y-6">

        <!-- Header Section -->
        <header class="flex items-center justify-between py-2">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-check text-lg font-bold"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight text-white flex items-center gap-2">
                        TaskFlow
                    </h1>
                    <p id="current-date" class="text-xs text-slate-400 font-medium">2026年9月28日星期一</p>
                </div>
            </div>

            <!-- Top Right Action Controls -->
            <div class="flex items-center gap-2">
                <button id="theme-toggle-btn" class="p-2.5 rounded-xl bg-[#131C35] border border-[#202E54] text-amber-400 hover:bg-[#182342] transition-colors" title="切換主題">
                    <i class="fa-solid fa-sun text-sm" id="theme-icon"></i>
                </button>
                <button id="clear-all-data-btn" class="p-2.5 rounded-xl bg-[#131C35] border border-[#202E54] text-slate-400 hover:text-rose-400 hover:bg-[#182342] transition-colors" title="清除所有資料">
                    <i class="fa-solid fa-ellipsis-vertical text-sm"></i>
                </button>
            </div>
        </header>

        <!-- Hero Progress Banner Card -->
        <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-500 p-6 sm:p-7 text-white shadow-xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div class="space-y-1.5 z-10">
                <span class="inline-block text-[11px] font-semibold uppercase tracking-wider text-blue-100 bg-white/10 px-2.5 py-0.5 rounded-full backdrop-blur-sm">
                    今日目標進度
                </span>
                <h2 id="hero-heading" class="text-2xl sm:text-3xl font-extrabold tracking-tight">加油！開啟高效的一天</h2>
                <p id="hero-subtext" class="text-xs sm:text-sm text-blue-100/90 font-medium">已完成 0 個任務，剩餘 0 個未完成</p>
            </div>

            <!-- Right Gauge Circle Box -->
            <div class="z-10 flex items-center gap-3.5 bg-white/10 backdrop-blur-md px-5 py-3 rounded-2xl border border-white/20 self-end sm:self-auto">
                <div class="text-right">
                    <div id="progress-percent" class="text-2xl font-black tracking-tight">0%</div>
                    <div class="text-[10px] text-blue-100/90 font-medium">總完成率</div>
                </div>
                <!-- Circle SVG Progress Ring -->
                <div class="relative w-12 h-12 flex items-center justify-center flex-shrink-0">
                    <svg class="w-full h-full -rotate-90" viewBox="0 0 36 36">
                        <path class="text-white/20" stroke-width="4" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path id="progress-ring" class="text-white" stroke-dasharray="100, 100" stroke-dashoffset="100" stroke-width="4" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    </svg>
                </div>
            </div>

            <!-- Decorative Glow Background Effect -->
            <div class="absolute -right-8 -bottom-8 w-44 h-44 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
        </div>

        <!-- Add Task Input Card -->
        <div class="bg-[#131C35] border border-[#202E54] rounded-3xl p-5 shadow-lg space-y-4">
            <form id="add-task-form" class="space-y-4">
                <!-- Main Title Input + Add Button -->
                <div class="flex flex-col sm:flex-row items-center gap-3">
                    <input 
                        type="text" 
                        id="task-title-input" 
                        placeholder="新增待辦事項... (按下 Enter 或點擊新增)" 
                        required 
                        class="w-full bg-[#0B132B] text-slate-100 placeholder-slate-500 text-sm px-4 py-3.5 rounded-2xl border border-[#202E54] focus:outline-none focus:border-blue-500 transition-colors shadow-inner"
                    >
                    <button 
                        type="submit" 
                        class="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm px-6 py-3.5 rounded-2xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-600/30 active:scale-95 whitespace-nowrap"
                    >
                        <i class="fa-solid fa-plus"></i> 新增事項
                    </button>
                </div>

                <!-- Meta Attribute Selectors Bar -->
                <div class="flex flex-wrap items-center gap-3 text-xs text-slate-300 pt-1">
                    <!-- Priority Selector -->
                    <div class="flex items-center gap-2 bg-[#0B132B] px-3.5 py-2.5 rounded-xl border border-[#202E54]">
                        <span class="text-slate-400 font-medium"><i class="fa-solid fa-flag text-slate-400"></i> 優先權：</span>
                        <select id="task-priority-select" class="bg-transparent text-slate-100 focus:outline-none cursor-pointer font-medium">
                            <option value="medium" class="bg-[#131C35] text-slate-100">🟡 中優先</option>
                            <option value="high" class="bg-[#131C35] text-slate-100">🔴 高優先</option>
                            <option value="low" class="bg-[#131C35] text-slate-100">🟢 低優先</option>
                        </select>
                    </div>

                    <!-- Category Selector -->
                    <div class="flex items-center gap-2 bg-[#0B132B] px-3.5 py-2.5 rounded-xl border border-[#202E54]">
                        <span class="text-slate-400 font-medium"><i class="fa-solid fa-folder text-slate-400"></i> 分類：</span>
                        <select id="task-category-select" class="bg-transparent text-slate-100 focus:outline-none cursor-pointer font-medium">
                            <option value="個人" class="bg-[#131C35] text-slate-100">👤 個人</option>
                            <option value="工作" class="bg-[#131C35] text-slate-100">💼 工作</option>
                            <option value="學習" class="bg-[#131C35] text-slate-100">📚 學習</option>
                            <option value="購物" class="bg-[#131C35] text-slate-100">🛒 購物</option>
                            <option value="健康" class="bg-[#131C35] text-slate-100">🍎 健康</option>
                        </select>
                    </div>

                    <!-- Due Date Selector -->
                    <div class="flex items-center gap-2 bg-[#0B132B] px-3.5 py-2.5 rounded-xl border border-[#202E54]">
                        <span class="text-slate-400 font-medium"><i class="fa-solid fa-calendar-days text-slate-400"></i> 到期日：</span>
                        <input type="date" id="task-due-date" class="bg-transparent text-slate-100 focus:outline-none cursor-pointer text-xs">
                    </div>
                </div>
            </form>
        </div>

        <!-- Filter Tabs & Tools Row -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 pt-2">
            <!-- Status Tabs -->
            <div class="flex items-center bg-[#131C35] p-1 rounded-2xl border border-[#202E54] text-xs font-medium w-full md:w-auto">
                <button data-status="all" class="status-tab flex-1 md:flex-none px-4 py-2 rounded-xl bg-blue-600 text-white transition-all">
                    全部 <span id="cnt-all" class="ml-1 opacity-80">0</span>
                </button>
                <button data-status="active" class="status-tab flex-1 md:flex-none px-4 py-2 rounded-xl text-slate-400 hover:text-white transition-all">
                    進行中 <span id="cnt-active" class="ml-1 opacity-80">0</span>
                </button>
                <button data-status="completed" class="status-tab flex-1 md:flex-none px-4 py-2 rounded-xl text-slate-400 hover:text-white transition-all">
                    已完成 <span id="cnt-completed" class="ml-1 opacity-80">0</span>
                </button>
            </div>

            <!-- Search Input & Sorting Selector -->
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="relative flex-1 md:w-60">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="搜尋待辦事項..." 
                        class="w-full bg-[#131C35] text-slate-100 placeholder-slate-500 text-xs pl-9 pr-3 py-2.5 rounded-xl border border-[#202E54] focus:outline-none focus:border-blue-500 transition-colors"
                    >
                </div>
                <select id="sort-select" class="bg-[#131C35] text-slate-300 text-xs px-3.5 py-2.5 rounded-xl border border-[#202E54] focus:outline-none cursor-pointer font-medium">
                    <option value="newest">最新建立</option>
                    <option value="oldest">最早建立</option>
                    <option value="dueDate">到期日近到遠</option>
                    <option value="priority">優先權高到低</option>
                </select>
            </div>
        </div>

        <!-- Category Filter Pills Bar -->
        <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs no-scrollbar">
            <span class="text-slate-400 font-medium flex items-center gap-1.5 whitespace-nowrap mr-1">
                <i class="fa-solid fa-filter text-[10px]"></i> 分類：
            </span>
            <button data-cat="all" class="cat-pill px-3.5 py-1.5 rounded-xl border border-blue-500 bg-blue-500/20 text-blue-300 whitespace-nowrap font-medium transition-all">
                全部
            </button>
            <button data-cat="工作" class="cat-pill px-3.5 py-1.5 rounded-xl border border-[#202E54] bg-[#131C35] text-slate-300 hover:border-slate-500 whitespace-nowrap transition-all">
                💼 工作
            </button>
            <button data-cat="個人" class="cat-pill px-3.5 py-1.5 rounded-xl border border-[#202E54] bg-[#131C35] text-slate-300 hover:border-slate-500 whitespace-nowrap transition-all">
                👤 個人
            </button>
            <button data-cat="學習" class="cat-pill px-3.5 py-1.5 rounded-xl border border-[#202E54] bg-[#131C35] text-slate-300 hover:border-slate-500 whitespace-nowrap transition-all">
                📚 學習
            </button>
            <button data-cat="購物" class="cat-pill px-3.5 py-1.5 rounded-xl border border-[#202E54] bg-[#131C35] text-slate-300 hover:border-slate-500 whitespace-nowrap transition-all">
                🛒 購物
            </button>
            <button data-cat="健康" class="cat-pill px-3.5 py-1.5 rounded-xl border border-[#202E54] bg-[#131C35] text-slate-300 hover:border-slate-500 whitespace-nowrap transition-all">
                🍎 健康
            </button>
        </div>

        <!-- Task List Area -->
        <div class="space-y-3 min-h-[180px]">
            <ul id="task-list" class="space-y-3">
                <!-- Rendered dynamically -->
            </ul>

            <!-- Empty State Card -->
            <div id="empty-state" class="hidden flex flex-col items-center justify-center py-16 px-4 border-2 border-dashed border-[#1C294D] rounded-3xl bg-[#131C35]/30 text-center space-y-3">
                <div class="w-16 h-16 rounded-full bg-[#131C35] border border-[#202E54] flex items-center justify-center text-slate-500 shadow-inner">
                    <i class="fa-regular fa-clipboard text-3xl"></i>
                </div>
                <p class="text-slate-300 font-semibold text-sm">目前沒有待辦事項</p>
                <p class="text-xs text-slate-500">在上方欄位輸入內容並按下「新增事項」來開始規劃吧！</p>
            </div>
        </div>

    </div>

    <!-- Edit Task Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-[#131C35] border border-[#202E54] w-full max-w-md rounded-3xl p-6 space-y-5 shadow-2xl">
            <div class="flex items-center justify-between pb-3 border-b border-[#202E54]">
                <h3 class="text-base font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-blue-400"></i> 編輯待辦事項
                </h3>
                <button id="close-edit-modal-btn" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="edit-task-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">事項名稱</label>
                    <input 
                        type="text" 
                        id="edit-title-input" 
                        required 
                        class="w-full bg-[#0B132B] text-slate-100 text-sm px-4 py-3 rounded-2xl border border-[#202E54] focus:outline-none focus:border-blue-500 transition-colors"
                    >
                </div>

                <div class="grid grid-cols-2 gap-3 text-xs">
                    <div>
                        <label class="block text-slate-400 mb-1 font-medium">優先權</label>
                        <select id="edit-priority-select" class="w-full bg-[#0B132B] text-slate-100 border border-[#202E54] rounded-xl px-3 py-2.5 focus:outline-none">
                            <option value="medium">🟡 中優先</option>
                            <option value="high">🔴 高優先</option>
                            <option value="low">🟢 低優先</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-slate-400 mb-1 font-medium">分類</label>
                        <select id="edit-category-select" class="w-full bg-[#0B132B] text-slate-100 border border-[#202E54] rounded-xl px-3 py-2.5 focus:outline-none">
                            <option value="個人">👤 個人</option>
                            <option value="工作">💼 工作</option>
                            <option value="學習">📚 學習</option>
                            <option value="購物">🛒 購物</option>
                            <option value="健康">🍎 健康</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-slate-400 text-xs mb-1 font-medium">到期日 (選填)</label>
                    <input type="date" id="edit-due-date" class="w-full bg-[#0B132B] text-slate-100 border border-[#202E54] rounded-xl px-3 py-2.5 text-xs focus:outline-none">
                </div>

                <div class="flex items-center gap-3 pt-2">
                    <button type="button" id="cancel-edit-btn" class="flex-1 py-3 rounded-2xl bg-slate-800 text-slate-300 text-xs font-semibold hover:bg-slate-700 transition-colors">
                        取消
                    </button>
                    <button type="submit" class="flex-1 py-3 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold shadow-lg shadow-blue-600/30 transition-all">
                        更新事項
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom Confirm Modal -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-[#131C35] border border-[#202E54] w-full max-w-xs rounded-3xl p-5 text-center space-y-4 shadow-2xl">
            <div class="w-12 h-12 rounded-full bg-rose-500/10 border border-rose-500/30 text-rose-400 flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <div>
                <h4 id="confirm-modal-title" class="font-bold text-white text-base">確定執行操作？</h4>
                <p id="confirm-modal-desc" class="text-xs text-slate-400 mt-1">此動作無法復原。</p>
            </div>
            <div class="flex items-center gap-2 pt-2">
                <button id="confirm-cancel-btn" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold hover:bg-slate-700">取消</button>
                <button id="confirm-ok-btn" class="flex-1 py-2.5 rounded-xl bg-rose-600 text-white text-xs font-semibold hover:bg-rose-500">確定刪除</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-[#131C35] border border-[#202E54] text-slate-100 text-xs px-4 py-3 rounded-2xl shadow-2xl opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center gap-2.5">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
        <span id="toast-text">已更新事項</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // State
            let todos = JSON.parse(localStorage.getItem('taskflow_swp03_todos') || '[]');
            let currentStatus = 'all';
            let currentCategory = 'all';
            let searchQuery = '';
            let currentSort = 'newest';
            let editingTodoId = null;
            let pendingConfirmAction = null;

            // DOM Selectors
            const taskList = document.getElementById('task-list');
            const emptyState = document.getElementById('empty-state');
            const addTaskForm = document.getElementById('add-task-form');
            const searchInput = document.getElementById('search-input');
            const sortSelect = document.getElementById('sort-select');

            // Category Emoji Mapping
            const categoryIcons = {
                '工作': '💼',
                '個人': '👤',
                '學習': '📚',
                '購物': '🛒',
                '健康': '🍎'
            };

            // Date Formatting Header
            function renderDate() {
                const now = new Date();
                const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                const formatted = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日${days[now.getDay()]}`;
                document.getElementById('current-date').textContent = formatted;
            }

            // Save to LocalStorage
            function saveTodos() {
                localStorage.setItem('taskflow_swp03_todos', JSON.stringify(todos));
                render();
            }

            // Toast Notification Helper
            function showToast(msg, iconClass = 'fa-solid fa-circle-check text-emerald-400') {
                const toast = document.getElementById('toast');
                const toastText = document.getElementById('toast-text');
                const toastIcon = document.getElementById('toast-icon');

                toastText.textContent = msg;
                toastIcon.className = iconClass;
                toast.classList.remove('opacity-0', 'pointer-events-none');
                toast.classList.add('opacity-100', '-translate-y-2');

                setTimeout(() => {
                    toast.classList.add('opacity-0', 'pointer-events-none');
                    toast.classList.remove('opacity-100', '-translate-y-2');
                }, 2200);
            }

            // Form Submit (Add New Task)
            addTaskForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const titleInput = document.getElementById('task-title-input');
                const title = titleInput.value.trim();
                if (!title) return;

                const newTodo = {
                    id: Date.now().toString(),
                    text: title,
                    priority: document.getElementById('task-priority-select').value,
                    category: document.getElementById('task-category-select').value,
                    dueDate: document.getElementById('task-due-date').value,
                    completed: false,
                    createdAt: new Date().toISOString()
                };

                todos.unshift(newTodo);
                saveTodos();
                
                titleInput.value = '';
                document.getElementById('task-due-date').value = '';
                showToast('已成功新增待辦事項！');
            });

            // Toggle Completed State
            window.toggleTask = function(id) {
                todos = todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
                saveTodos();
            };

            // Custom Confirm Dialog
            function showConfirmModal(title, desc, onConfirm) {
                document.getElementById('confirm-modal-title').textContent = title;
                document.getElementById('confirm-modal-desc').textContent = desc;
                const modal = document.getElementById('confirm-modal');
                modal.classList.remove('opacity-0', 'pointer-events-none');
                pendingConfirmAction = onConfirm;
            }

            document.getElementById('confirm-cancel-btn').addEventListener('click', () => {
                document.getElementById('confirm-modal').classList.add('opacity-0', 'pointer-events-none');
                pendingConfirmAction = null;
            });

            document.getElementById('confirm-ok-btn').addEventListener('click', () => {
                if (pendingConfirmAction) pendingConfirmAction();
                document.getElementById('confirm-modal').classList.add('opacity-0', 'pointer-events-none');
                pendingConfirmAction = null;
            });

            // Delete Task Handler
            window.deleteTask = function(id) {
                showConfirmModal('確定要刪除此事項？', '刪除後無法恢復該事項記錄。', () => {
                    todos = todos.filter(t => t.id !== id);
                    saveTodos();
                    showToast('已刪除事項', 'fa-solid fa-trash-can text-rose-400');
                });
            };

            // Edit Task Handlers
            const editModal = document.getElementById('edit-modal');
            
            window.openEditModal = function(id) {
                const todo = todos.find(t => t.id === id);
                if (!todo) return;
                editingTodoId = id;

                document.getElementById('edit-title-input').value = todo.text;
                document.getElementById('edit-priority-select').value = todo.priority;
                document.getElementById('edit-category-select').value = todo.category;
                document.getElementById('edit-due-date').value = todo.dueDate || '';

                editModal.classList.remove('opacity-0', 'pointer-events-none');
            };

            function closeEditModal() {
                editModal.classList.add('opacity-0', 'pointer-events-none');
                editingTodoId = null;
            }

            document.getElementById('close-edit-modal-btn').addEventListener('click', closeEditModal);
            document.getElementById('cancel-edit-btn').addEventListener('click', closeEditModal);

            document.getElementById('edit-task-form').addEventListener('submit', (e) => {
                e.preventDefault();
                if (!editingTodoId) return;

                const newTitle = document.getElementById('edit-title-input').value.trim();
                if (!newTitle) return;

                todos = todos.map(t => t.id === editingTodoId ? {
                    ...t,
                    text: newTitle,
                    priority: document.getElementById('edit-priority-select').value,
                    category: document.getElementById('edit-category-select').value,
                    dueDate: document.getElementById('edit-due-date').value
                } : t);

                saveTodos();
                closeEditModal();
                showToast('已更新待辦事項內容');
            });

            // Filter & Sort Logic
            function getFilteredAndSortedTodos() {
                let filtered = todos.filter(todo => {
                    if (currentStatus === 'active' && todo.completed) return false;
                    if (currentStatus === 'completed' && !todo.completed) return false;
                    if (currentCategory !== 'all' && todo.category !== currentCategory) return false;
                    if (searchQuery && !todo.text.toLowerCase().includes(searchQuery.toLowerCase())) return false;
                    return true;
                });

                const priorityWeight = { high: 3, medium: 2, low: 1 };

                return filtered.sort((a, b) => {
                    if (currentSort === 'newest') return new Date(b.createdAt) - new Date(a.createdAt);
                    if (currentSort === 'oldest') return new Date(a.createdAt) - new Date(b.createdAt);
                    if (currentSort === 'dueDate') {
                        if (!a.dueDate) return 1;
                        if (!b.dueDate) return -1;
                        return new Date(a.dueDate) - new Date(b.dueDate);
                    }
                    if (currentSort === 'priority') {
                        return priorityWeight[b.priority] - priorityWeight[a.priority];
                    }
                    return 0;
                });
            }

            // Update Progress Hero Dashboard
            function updateHeroDashboard() {
                const total = todos.length;
                const completed = todos.filter(t => t.completed).length;
                const active = total - completed;
                const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

                document.getElementById('cnt-all').textContent = total;
                document.getElementById('cnt-active').textContent = active;
                document.getElementById('cnt-completed').textContent = completed;

                document.getElementById('progress-percent').textContent = `${percent}%`;
                document.getElementById('hero-subtext').textContent = `已完成 ${completed} 個任務，剩餘 ${active} 個未完成`;

                // SVG Dashoffset logic
                const circle = document.getElementById('progress-ring');
                const offset = 100 - percent;
                circle.setAttribute('stroke-dashoffset', offset);

                const heading = document.getElementById('hero-heading');
                if (total === 0) heading.textContent = '開始規劃今日事項';
                else if (percent === 100) heading.textContent = '🎉 今日任務全數達成！';
                else if (percent >= 50) heading.textContent = '進度過半！繼續保持';
                else heading.textContent = '加油！開啟高效的一天';
            }

            // Render Tasks List
            function renderTasks() {
                const filtered = getFilteredAndSortedTodos();

                if (filtered.length === 0) {
                    taskList.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    return;
                }

                emptyState.classList.add('hidden');

                taskList.innerHTML = filtered.map(todo => {
                    const isDone = todo.completed;

                    // Priority Badge Styling
                    let prioBadge = '<span class="text-[10px] px-2 py-0.5 rounded-md bg-amber-500/10 text-amber-400 border border-amber-500/20 font-medium">🟡 中優先</span>';
                    if (todo.priority === 'high') {
                        prioBadge = '<span class="text-[10px] px-2 py-0.5 rounded-md bg-rose-500/10 text-rose-400 border border-rose-500/20 font-medium">🔴 高優先</span>';
                    } else if (todo.priority === 'low') {
                        prioBadge = '<span class="text-[10px] px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">🟢 低優先</span>';
                    }

                    // Due Date Badge
                    let dueDateBadge = '';
                    if (todo.dueDate) {
                        dueDateBadge = `
                            <span class="text-[10px] text-slate-400 flex items-center gap-1 bg-[#0B132B] px-2 py-0.5 rounded-md border border-[#202E54]">
                                <i class="fa-regular fa-clock text-[9px]"></i> ${todo.dueDate}
                            </span>
                        `;
                    }

                    const catIcon = categoryIcons[todo.category] || '📁';

                    return `
                        <li class="bg-[#131C35] hover:bg-[#172344] border border-[#202E54] rounded-2xl p-4 transition-all flex items-center justify-between gap-3 shadow-sm group">
                            <div class="flex items-center gap-3.5 flex-1 min-w-0">
                                <!-- Checkbox Button -->
                                <button 
                                    onclick="toggleTask('${todo.id}')" 
                                    class="w-6 h-6 rounded-lg border-2 flex items-center justify-center flex-shrink-0 transition-all cursor-pointer ${
                                        isDone 
                                        ? 'bg-blue-600 border-blue-600 text-white shadow-md shadow-blue-600/30' 
                                        : 'border-slate-500 hover:border-blue-400 text-transparent'
                                    }"
                                >
                                    <i class="fa-solid fa-check text-xs"></i>
                                </button>

                                <div class="flex flex-col gap-1.5 min-w-0 flex-1">
                                    <span class="text-sm font-medium text-slate-100 break-words ${isDone ? 'line-through text-slate-500' : ''}">
                                        ${todo.text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
                                    </span>
                                    <div class="flex flex-wrap items-center gap-1.5">
                                        ${prioBadge}
                                        <span class="text-[10px] text-slate-400 bg-[#0B132B] px-2 py-0.5 rounded-md border border-[#202E54]">
                                            ${catIcon} ${todo.category}
                                        </span>
                                        ${dueDateBadge}
                                    </div>
                                </div>
                            </div>

                            <!-- Action Icons -->
                            <div class="flex items-center gap-1">
                                <button onclick="openEditModal('${todo.id}')" class="p-2 text-slate-400 hover:text-blue-400 rounded-lg hover:bg-[#0B132B] transition-colors" title="編輯">
                                    <i class="fa-regular fa-pen-to-square text-xs"></i>
                                </button>
                                <button onclick="deleteTask('${todo.id}')" class="p-2 text-slate-400 hover:text-rose-400 rounded-lg hover:bg-[#0B132B] transition-colors" title="刪除">
                                    <i class="fa-regular fa-trash-can text-xs"></i>
                                </button>
                            </div>
                        </li>
                    `;
                }).join('');
            }

            // Main Render Function
            function render() {
                updateHeroDashboard();
                renderTasks();
            }

            // Status Tab Filtering
            document.querySelectorAll('.status-tab').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.status-tab').forEach(b => {
                        b.classList.remove('bg-blue-600', 'text-white');
                        b.classList.add('text-slate-400');
                    });
                    const target = e.currentTarget;
                    target.classList.add('bg-blue-600', 'text-white');
                    target.classList.remove('text-slate-400');
                    currentStatus = target.dataset.status;
                    render();
                });
            });

            // Category Pill Filtering
            document.querySelectorAll('.cat-pill').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.cat-pill').forEach(p => {
                        p.classList.remove('border-blue-500', 'bg-blue-500/20', 'text-blue-300');
                        p.classList.add('border-[#202E54]', 'bg-[#131C35]', 'text-slate-300');
                    });
                    const target = e.currentTarget;
                    target.classList.remove('border-[#202E54]', 'bg-[#131C35]', 'text-slate-300');
                    target.classList.add('border-blue-500', 'bg-blue-500/20', 'text-blue-300');
                    currentCategory = target.dataset.cat;
                    render();
                });
            });

            // Search Input Handler
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.trim();
                render();
            });

            // Sorting Select Handler
            sortSelect.addEventListener('change', (e) => {
                currentSort = e.target.value;
                render();
            });

            // Theme Toggle Handler
            let isDark = true;
            document.getElementById('theme-toggle-btn').addEventListener('click', () => {
                isDark = !isDark;
                const icon = document.getElementById('theme-icon');
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    icon.className = 'fa-solid fa-sun text-sm text-amber-400';
                } else {
                    document.documentElement.classList.remove('dark');
                    icon.className = 'fa-solid fa-moon text-sm text-slate-600';
                }
            });

            // Clear All Data Modal Handler
            document.getElementById('clear-all-data-btn').addEventListener('click', () => {
                showConfirmModal('重置所有資料？', '此動作將會清除 LocalStorage 中的所有待辦事項記錄。', () => {
                    todos = [];
                    saveTodos();
                    showToast('已完全重置所有資料', 'fa-solid fa-trash-can text-rose-400');
                });
            });

            // Initial Run
            renderDate();
            render();
        });
    </script>
</body>
</html>
